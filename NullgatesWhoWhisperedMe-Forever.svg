<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nullgate's Who Whispered Me - Forever: a whisper-pink speech bubble under a golden magnifying glass -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3d"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#c9a54e"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb8ff"/>
      <stop offset="1" stop-color="#c04ac6"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e8f7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6fb7e8" stop-opacity="0.25"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5a2b"/>
      <stop offset="1" stop-color="#4a2c12"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff80ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a02cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- frame -->
  <rect x="20" y="20" width="472" height="472" rx="64" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="64" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="44" y="44" width="424" height="424" rx="44" fill="none" stroke="#c9a54e" stroke-opacity="0.35" stroke-width="3"/>

  <!-- whisper-pink glow -->
  <circle cx="236" cy="236" r="190" fill="url(#aura)"/>

  <!-- speech bubble with its tail at the lower left -->
  <path d="M120 112 H332 A48 48 0 0 1 380 160 V266 A48 48 0 0 1 332 314 H196 L128 372 L144 314 H120 A48 48 0 0 1 72 266 V160 A48 48 0 0 1 120 112 Z"
        fill="#ff80ff" opacity="0.5" filter="url(#glow)"/>
  <path d="M120 112 H332 A48 48 0 0 1 380 160 V266 A48 48 0 0 1 332 314 H196 L128 372 L144 314 H120 A48 48 0 0 1 72 266 V160 A48 48 0 0 1 120 112 Z"
        fill="url(#bubble)" stroke="#ffe6ff" stroke-width="6" stroke-linejoin="round"/>
  <path d="M112 150 Q112 136 128 136 H200" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="10" stroke-linecap="round"/>
  <!-- the whisper: three dots -->
  <circle cx="160" cy="214" r="20" fill="#ffffff"/>
  <circle cx="226" cy="214" r="20" fill="#ffffff"/>
  <circle cx="292" cy="214" r="20" fill="#ffffff" opacity="0.9"/>

  <!-- magnifying glass: who is it? -->
  <g transform="translate(0,4)">
    <ellipse cx="376" cy="438" rx="70" ry="12" fill="#000000" opacity="0.35"/>
    <path d="M384 352 L438 406" stroke="#000000" stroke-opacity="0.35" stroke-width="40" stroke-linecap="round" transform="translate(4,6)"/>
    <path d="M384 352 L438 406" stroke="url(#handle)" stroke-width="34" stroke-linecap="round"/>
    <path d="M380 348 L398 366" stroke="url(#gold)" stroke-width="38" stroke-linecap="butt"/>
    <circle cx="336" cy="300" r="78" fill="#f0d27a" opacity="0.35" filter="url(#glow)"/>
    <circle cx="336" cy="300" r="64" fill="url(#glass)"/>
    <circle cx="336" cy="300" r="64" fill="none" stroke="url(#gold)" stroke-width="18"/>
    <path d="M300 286 A38 38 0 0 1 330 258" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <path d="M410 104 l8 21 l21 8 l-21 8 l-8 21 l-8 -21 l-21 -8 l21 -8 Z" fill="#ffd6ff"/>
  <path d="M96 404 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 Z" fill="#ff9cff"/>
  <circle cx="440" cy="196" r="6" fill="#ffd6ff" opacity="0.85"/>
  <circle cx="218" cy="420" r="5" fill="#ffd6ff" opacity="0.8"/>
</svg>
